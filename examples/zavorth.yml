version: 1

project:
  name: zavorth-demo
  root: .
  description: Local project operated by Zavorth Developer Workspace.

processes:
  - id: app
    name: Web App
    command: npm run dev
    cwd: .
    restart: on-failure
    health:
      type: http
      url: http://localhost:3000

  - id: tests
    name: Test Watcher
    command: npm run test -- --watch
    cwd: .
    restart: never

mcp:
  servers: []

agents:
  - id: maintainer
    role: project-maintainer
    watches:
      - app
      - tests
    mode: suggest

hooks:
  - id: test-failure
    when:
      process: tests
      pattern: "(FAIL|Error|Exception)"
    action:
      type: agent-run
      mode: suggest
      prompt: Diagnose the failing test and propose the smallest safe fix.

policy:
  defaultMode: suggest
  requireApprovalFor:
    - filesystem.write
    - process.kill
    - network.public
    - selfmod.apply
