services:
  zavorth:
    build:
      context: ../
      dockerfile: deploy/production.Dockerfile
    image: zavorth/runtime:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      ZAVORTH_WEB_HOST: 0.0.0.0
      ZAVORTH_WEB_PORT: 33333
      ZAVORTH_PROFILE: ops
      ZAVORTH_CAPABILITY_POLICY: ask-on-demand
      ZAVORTH_SELFMOD_POLICY: owner_trusted
      ZAVORTH_ALLOW_STARTUP_INSTALL: "false"
    mem_limit: 2048m
    cpus: 2
    pids_limit: 256
    ports:
      - "33333:33333"
    volumes:
      - zavorth_data:/usr/src/app/data
      - zavorth_tmp:/usr/src/app/tmp
      - zavorth_memory:/usr/src/app/memory
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:33333/api/auth/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "5"

volumes:
  zavorth_data:
  zavorth_tmp:
  zavorth_memory:
