services:
  - type: web
    name: zavorth
    runtime: docker
    dockerfilePath: ./deploy/production.Dockerfile
    plan: starter
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: LOG_LEVEL
        value: info
    scaling:
      minInstances: 1
      maxInstances: 3
