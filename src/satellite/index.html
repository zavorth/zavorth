<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="description" content="Zavorth Satellite - lightweight mobile companion for the governed Zavorth runtime.">
  <title>Zavorth Satellite</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="satellite.css">
</head>
<body>
  <div id="app">
    <header id="header">
      <div class="header-left">
        <span class="logo">Z</span>
        <h1>Zavorth Satellite</h1>
      </div>
      <div class="header-right">
        <span id="connection-status" class="status-badge disconnected">Disconnected</span>
        <button id="btn-settings" class="icon-btn" title="Settings">Config</button>
      </div>
    </header>

    <main id="chat-area">
      <div id="messages" role="log" aria-live="polite">
        <div class="welcome-message">
          <h2>Zavorth Satellite</h2>
          <p>Lightweight mobile companion for Zavorth approvals and runtime chat.</p>
          <p class="hint">Use the dashboard token to connect. Node ID and shared secret are optional for Node Mesh heartbeat.</p>
        </div>
      </div>
    </main>

    <footer id="input-area">
      <form id="chat-form" autocomplete="off">
        <textarea id="chat-input" placeholder="Type your message..." rows="1" maxlength="4000"></textarea>
        <button type="submit" id="btn-send" disabled title="Send">Send</button>
      </form>
    </footer>

    <dialog id="settings-dialog">
      <div class="dialog-content">
        <h2>Settings</h2>
        <label for="ws-url">Runtime WebSocket URL</label>
        <input id="ws-url" type="url" placeholder="ws://127.0.0.1:3000/api/web/satellite/ws" value="">
        <label for="auth-token">Dashboard token</label>
        <input id="auth-token" type="password" placeholder="Dashboard token">
        <label for="node-id">Optional Node Mesh ID</label>
        <input id="node-id" type="text" placeholder="mobile-node">
        <label for="shared-secret">Optional Node Mesh shared secret</label>
        <input id="shared-secret" type="password" placeholder="Secret issued during pairing">
        <div class="dialog-actions">
          <button id="btn-connect" class="primary">Connect</button>
          <button id="btn-disconnect" class="danger">Disconnect</button>
          <button id="btn-close-settings">Close</button>
        </div>
        <div id="settings-status"></div>
      </div>
    </dialog>
  </div>

  <script src="satellite.js"></script>
</body>
</html>
