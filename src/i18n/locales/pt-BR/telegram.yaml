auth:
  access_restricted: >-
    ⛔ **Acesso Restrito:**


    Como vice-dono(a), voce nao tem permissao para usar este comando de sistema/computador. Voce tem acesso a pesquisa,
    memoria, conversas e analises.
  host_readonly: |-
    Host novo detectado. O Zavorth entrou em modo somente leitura ate reautorizacao.
    Use `/hostauth status` para inspecionar e `/hostauth trust` no host atual para liberar execucao.
  unauthorized_group_admin: Apenas administradores do grupo podem usar este comando.
  unauthorized_sarcasm_1: Quem te deu permissao para falar comigo, mortal... Tente `/roll` se quiser brincar.
  unauthorized_sarcasm_2: Comandos de administrador nao funcionam para voce. Use `/8ball`.
  unauthorized_sarcasm_3: Eu sirvo apenas ao meu Mestre. Para voce, sou apenas um bot de jogos. Tente `/joke`.
