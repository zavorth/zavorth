pipeline:
  close_help: '- close: encerra um workflow bloqueado ou com falha'
  missing_step: Faltou a etapa para reiniciar...
  workflow_usage: |-
    Use /workflow <tipo> <objetivo>.

    Workflows disponiveis:
    - review: executa, revisa e fecha com um parecer final
    - ship: implementa, revisa e deixa pronto para entrega
    - research: pesquisa, sintetiza e devolve um briefing claro
    - sdd: roda o proximo papel do loop spec/plan/tasks de uma feature
    - resume: retoma um workflow existente pelo run id e, se quiser, por uma etapa especifica
    - restart-stage: reexecuta uma etapa especifica de um workflow existente
    - close: encerra um workflow bloqueado ou com falha para ele deixar de aparecer como retomada

    Exemplo de retomada:
    /workflow resume wf-ship-abc123 review
    /workflow restart-stage wf-ship-abc123 draft
  missing_workflow_id: 'Faltou o identificador do workflow. Exemplo: /workflow restart-stage wf-ship-abc123 <etapa>'
  missing_workflow_id_resume: 'Faltou o identificador do workflow. Exemplo: /workflow resume wf-ship-abc123 [etapa]'
  missing_stage: 'Faltou a etapa para reiniciar. Exemplo: /workflow restart-stage wf-ship-abc123 <etapa>'
  missing_close_id: 'Faltou o identificador do workflow. Exemplo: /workflow close wf-ship-abc123'
  unknown_workflow: >-
    Workflow desconhecido. Use /workflow review, /workflow ship, /workflow research, /workflow sdd, /workflow resume,
    /workflow restart-stage ou /workflow close.
  missing_objective: 'Faltou o objetivo. Exemplo: {example}'
  unknown_workflow_short: Workflow desconhecido. Use review, ship, research ou sdd.
  missing_workflow_objective: Faltou o objetivo para o workflow {workflow}.
