auth:
  access_restricted: >-
    ⛔ **Access Restricted:**


    As a vice-owner, you do not have permission to use this system/computer command. You have access to research,
    memory, conversations, and analysis.
  host_readonly: |-
    New host detected. Zavorth entered read-only mode until re-authorization.
    Use `/hostauth status` to inspect and `/hostauth trust` on the current host to enable execution.
  unauthorized_group_admin: Only group administrators can use this command.
