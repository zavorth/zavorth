  invalid_format: 'Invalid format. Example: /schedule every 1h /cleanup'
pipeline:
  close_help: '- close: ends a blocked or failed workflow'
  missing_step: Missing step to restart...
  workflow_usage: |-
    Use /workflow <type> <objective>.

    Available workflows:
    - review: executes, reviews and closes with a final assessment
    - ship: implements, reviews and leaves ready for delivery
    - research: researches, synthesizes and returns a clear briefing
    - sdd: runs the next paper of the spec/plan/tasks loop of a feature
    - resume: resumes an existing workflow by run id and, if desired, by a specific stage
    - restart-stage: re-executes a specific stage of an existing workflow
    - close: ends a blocked or failed workflow so it stops appearing as resumable

    Resume example:
    /workflow resume wf-ship-abc123 review
    /workflow restart-stage wf-ship-abc123 draft
  missing_workflow_id: 'Missing workflow identifier. Example: /workflow restart-stage wf-ship-abc123 <stage>'
  missing_workflow_id_resume: 'Missing workflow identifier. Example: /workflow resume wf-ship-abc123 [stage]'
  missing_stage: 'Missing stage to restart. Example: /workflow restart-stage wf-ship-abc123 <stage>'
  missing_close_id: 'Missing workflow identifier. Example: /workflow close wf-ship-abc123'
  unknown_workflow: >-
    Unknown workflow. Use /workflow review, /workflow ship, /workflow research, /workflow sdd, /workflow resume,
    /workflow restart-stage or /workflow close.
  missing_objective: 'Missing objective. Example: {example}'
  unknown_workflow_short: Unknown workflow. Use review, ship, research or sdd.
  missing_workflow_objective: Missing objective for the {workflow} workflow.
