welcome:
  title: "Welcome to Zavorth"
  subtitle: "Let's set up your AI assistant."
  description: "Zavorth is a governed AI agent that works with local control, explicit trust, and visible receipts."

steps:
  language:
    title: "Language"
    prompt: "Which language should I use?"
    en: "English"
    pt: "Portuguese (Brazil)"
  identity:
    title: "Identity"
    agent_name: "What should I call you?"
    user_name: "What should I call you?"
  provider:
    title: "Provider"
    prompt: "Select your AI provider:"
    api_key: "Enter your API key:"
  channels:
    title: "Channels"
    prompt: "Which channels do you want to enable?"
  safety:
    title: "Safety"
    prompt: "How should I handle risky actions?"
    conservative: "Conservative - always ask first"
    balanced: "Balanced - ask for risky actions"
    autonomous: "Autonomous - act first, report after"
  complete:
    title: "Setup Complete"
    summary: "Your Zavorth is ready!"
    next_steps: "Next steps:"
    learning_tip: "Zavorth saves multi-tool workflows as local skill drafts (/learn); promote with /learn promote 1. Candidates plane is /learning."

progress:
  step_of: "Step {current} of {total}"
  completing: "Completing setup..."
  almost_done: "Almost done..."

conversation:
  review_preview: "Review this setup preview. Confirm it explicitly to apply the local profile, or edit any answer first."
  confirmation_invalid: "This setup preview is invalid or expired. Please review a new preview before confirming."
  apply_failed: "The local profile could not be applied safely. Review the setup answers and try again."
  applied: "Setup complete. I am ready to help with your first mission."
  questions:
    agent_name:
      label: "Agent name"
      prompt: "What should this agent be called?"
    user_name:
      label: "Your name"
      prompt: "What should Zavorth call you?"
    preferred_language:
      label: "Preferred conversation language"
      prompt: "Which language should Zavorth use when speaking with you?"
    experience_profile:
      label: "Experience profile"
      prompt: "Will you use Zavorth for daily life, creation, code, business or advanced operation?"
    detail_level:
      label: "Detail level"
      prompt: "Do you prefer simple or advanced detail?"
