  created_at: "created {date}"
  has_memory: "memory"
  has_config: "config"
  has_creds: "creds"
  created: "Instance \"{name}\" created at {path}"
  use_hint: "Use: ZAVORTH_INSTANCE={name} zavorth start"
  deleted: "Instance \"{name}\" deleted."
  name_required: "Instance name required. Usage: zavorth instance create <name>"
