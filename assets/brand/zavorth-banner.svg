<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <defs>
    <!-- Background & Aura Gradients -->
    <linearGradient id="deepBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070b09" />
      <stop offset="50%" stop-color="#030504" />
      <stop offset="100%" stop-color="#020302" />
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18" />
      <stop offset="40%" stop-color="#059669" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="mascotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#059669" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Grid Lines -->
    <pattern id="minimalGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#10b981" stroke-width="0.5" stroke-opacity="0.05" />
    </pattern>

    <!-- Filters -->
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Background Layers -->
  <rect width="1200" height="440" fill="url(#deepBg)" />
  <rect width="1200" height="440" fill="url(#minimalGrid)" />
  <rect width="1200" height="440" fill="url(#centerGlow)" />

  <!-- Accent Border Top & Bottom -->
  <rect x="0" y="0" width="1200" height="2" fill="#10b981" opacity="0.4" />
  <rect x="0" y="438" width="1200" height="2" fill="#10b981" opacity="0.2" />

  <!-- 2. Centered Main Hero Layout (OpenClaw / Hermes Style) -->
  <g transform="translate(600, 220)">
    
    <!-- Left: Iconic Glowing Mascot Mark -->
    <g transform="translate(-320, -70)">
      <!-- Aura Glow circle -->
      <circle cx="70" cy="70" r="90" fill="url(#mascotGlow)" />
      
      <!-- Mascot Outer Shadow/Glow (Pixel Art Form) -->
      <g transform="scale(1.75)">
        <path d="M20,0 h10 v20 h20 v-20 h10 v20 h10 v10 h-10 v10 h20 v20 h-10 v20 h-10 v-10 h-10 v10 h-20 v-10 h-10 v10 h-10 v-20 h-10 v-20 h20 v-10 h-10 z" fill="#10b981" filter="url(#neonBlur)" opacity="0.6" />
        <path d="M20,0 h10 v20 h20 v-20 h10 v20 h10 v10 h-10 v10 h20 v20 h-10 v20 h-10 v-10 h-10 v10 h-20 v-10 h-10 v10 h-10 v-20 h-10 v-20 h20 v-10 h-10 z" fill="#34d399" />
        
        <!-- Eyes (Glowing Cyan) -->
        <rect x="25" y="35" width="10" height="15" fill="#030504" />
        <rect x="65" y="35" width="10" height="15" fill="#030504" />
        <rect x="27" y="37" width="6" height="11" fill="#06b6d4" />
        <rect x="67" y="37" width="6" height="11" fill="#06b6d4" />
      </g>
    </g>

    <!-- Right: Massive Typography & Clean Tagline -->
    <g transform="translate(-110, -55)">
      <!-- Top Pill / Badge -->
      <g transform="translate(0, -25)">
        <rect x="0" y="0" width="180" height="26" rx="13" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.35" stroke-width="1" />
        <text x="90" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="2">GOVERNED RUNTIME</text>
      </g>

      <!-- Wordmark Title (High Impact) -->
      <text x="0" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="68" font-weight="900" fill="#ffffff" letter-spacing="-1.5">
        Zavorth
      </text>
      
      <!-- Primary Punchy Tagline (OpenClaw / Hermes Style) -->
      <text x="0" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="21" font-weight="700" fill="#34d399" letter-spacing="-0.3">
        Your AI that does things — and proves it.
      </text>

      <!-- Subtitle Description -->
      <text x="0" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="15" font-weight="400" fill="#94a3b8" letter-spacing="0">
        Ask naturally. Approve real risk. Keep cryptographic receipts.
      </text>
    </g>

  </g>
</svg>
