<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050807" />
      <stop offset="50%" stop-color="#0a120e" />
      <stop offset="100%" stop-color="#040605" />
    </linearGradient>

    <!-- Glow Gradients -->
    <radialGradient id="neonGlowLeft" cx="20%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#059669" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="neonGlowRight" cx="80%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="60%" stop-color="#0891b2" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10b981" stroke-width="0.75" stroke-opacity="0.08" />
    </pattern>

    <!-- Glassmorphism Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#13241b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#08140e" stop-opacity="0.85" />
    </linearGradient>

    <!-- Button Gradient -->
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="shadowCard" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- 1. Background Fill -->
  <rect width="1200" height="480" fill="url(#bgGrad)" />
  <rect width="1200" height="480" fill="url(#cyberGrid)" />
  <rect width="1200" height="480" fill="url(#neonGlowLeft)" />
  <rect width="1200" height="480" fill="url(#neonGlowRight)" />

  <!-- Accent Top Border -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#btnGrad)" />

  <!-- Left Accent Line -->
  <line x1="60" y1="90" x2="60" y2="390" stroke="#10b981" stroke-width="4" stroke-linecap="round" filter="url(#glowFilter)" />

  <!-- ================= LEFT HERO CONTENT ================= -->
  <g transform="translate(90, 110)">
    <!-- Mascot Mark (Pixel Art Style with Glow) -->
    <g transform="scale(0.85)">
      <!-- Glow behind mascot -->
      <rect x="15" y="15" width="70" height="70" rx="12" fill="#10b981" opacity="0.2" filter="url(#glowFilter)" />
      <!-- Mascot Pixel Shape -->
      <path d="M20,0 h10 v20 h20 v-20 h10 v20 h10 v10 h-10 v10 h20 v20 h-10 v20 h-10 v-10 h-10 v10 h-20 v-10 h-10 v10 h-10 v-20 h-10 v-20 h20 v-10 h-10 z" fill="#10b981" />
      <!-- Mascot Eyes -->
      <rect x="25" y="35" width="10" height="15" fill="#050807" />
      <rect x="65" y="35" width="10" height="15" fill="#050807" />
    </g>

    <!-- Category Pill -->
    <rect x="95" y="10" width="165" height="26" rx="13" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />
    <text x="177" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#10b981" text-anchor="middle" letter-spacing="1.5">GOVERNED RUNTIME</text>

    <!-- Main Title -->
    <text x="0" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">ZAVORTH</text>
    <text x="270" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#10b981">.</text>

    <!-- Tagline -->
    <text x="0" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#e2e8f0" letter-spacing="-0.2">
      Your AI that does things — and proves it.
    </text>

    <!-- Description -->
    <text x="0" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#94a3b8">
      Ask naturally. Approve real risk. Keep cryptographic receipts.
    </text>

    <!-- Pills / Feature Badges -->
    <g transform="translate(0, 245)">
      <!-- Pill 1: Local-First -->
      <rect x="0" y="0" width="105" height="28" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
      <text x="52" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1" text-anchor="middle">⚡ Local-First</text>

      <!-- Pill 2: MicroVM Sandbox -->
      <rect x="115" y="0" width="135" height="28" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
      <text x="182" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1" text-anchor="middle">🛡️ MicroVM Sandbox</text>

      <!-- Pill 3: Receipts -->
      <rect x="260" y="0" width="130" height="28" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
      <text x="325" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1" text-anchor="middle">📜 Verifiable Proof</text>
    </g>
  </g>

  <!-- ================= RIGHT UI CARD OVERLAY ================= -->
  <g transform="translate(680, 85)" filter="url(#shadowCard)">
    <!-- Glassmorphic Card Container -->
    <rect x="0" y="0" width="460" height="310" rx="16" fill="url(#cardGrad)" stroke="#10b981" stroke-opacity="0.2" stroke-width="1.5" />
    
    <!-- Card Header -->
    <circle cx="28" cy="28" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="44" cy="28" r="5" fill="#f59e0b" opacity="0.8" />
    <circle cx="60" cy="28" r="5" fill="#10b981" opacity="0.8" />
    
    <text x="230" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">Zavorth Control &amp; Policy Gate</text>
    <line x1="0" y1="52" x2="460" y2="52" stroke="#334155" stroke-opacity="0.4" stroke-width="1" />

    <!-- Terminal / Plan Simulation inside Card -->
    <g transform="translate(24, 70)">
      <!-- Step 1 -->
      <text x="0" y="16" font-family="'Fira Code', Consolas, monospace" font-size="12" fill="#10b981">● runtime: ready</text>
      <text x="130" y="16" font-family="'Fira Code', Consolas, monospace" font-size="12" fill="#64748b">| provider: local-gemini</text>

      <!-- Plan Box -->
      <rect x="0" y="32" width="412" height="74" rx="8" fill="#040d08" stroke="#10b981" stroke-opacity="0.2" stroke-width="1" />
      <text x="14" y="52" font-family="'Fira Code', Consolas, monospace" font-size="11" font-weight="700" fill="#f59e0b">⚠️ APPROVAL REQUIRED [EXPIRING IN 4m59s]</text>
      <text x="14" y="70" font-family="'Fira Code', Consolas, monospace" font-size="12" fill="#e2e8f0">Target: Update production gateway routing table</text>
      <text x="14" y="88" font-family="'Fira Code', Consolas, monospace" font-size="11" fill="#64748b">Sandbox: MicroVM (Isolated) • Blast Radius: Scoped</text>

      <!-- Interactive Action Buttons Simulated -->
      <g transform="translate(0, 120)">
        <!-- Approve Button -->
        <rect x="0" y="0" width="130" height="34" rx="6" fill="url(#btnGrad)" />
        <text x="65" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#040d08" text-anchor="middle">✓ Approve Run</text>

        <!-- Deny Button -->
        <rect x="140" y="0" width="90" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="185" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">Deny</text>

        <!-- Inspect Proof Button -->
        <rect x="240" y="0" width="172" height="34" rx="6" fill="#0f172a" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
        <text x="326" y="22" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#10b981" text-anchor="middle">#receipt_0x8f2a</text>
      </g>

      <!-- Execution Status Line -->
      <g transform="translate(0, 180)">
        <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#64748b">Surfaces:</text>
        <text x="65" y="14" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">Desktop • Control • CLI/TUI • Telegram</text>
      </g>
    </g>
  </g>
</svg>
