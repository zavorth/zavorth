<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Seamless to GitHub Dark Mode -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f0e" />
      <stop offset="100%" stop-color="#050807" />
    </linearGradient>

    <!-- Zavorth Brand Emerald Neon Gradient -->
    <linearGradient id="brandEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E88F" />
      <stop offset="50%" stop-color="#25f5a5" />
      <stop offset="100%" stop-color="#3FE7A8" />
    </linearGradient>

    <!-- Mascot Gradient -->
    <linearGradient id="mascotBody" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E88F"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="mascotDark" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="mascotAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E88F" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="textAura" cx="30%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#00E88F" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bg)" rx="16" />
  <rect width="1200" height="360" fill="url(#textAura)" rx="16" />

  <!-- Main Centered Content Group -->
  <g transform="translate(180, 70)">
    
    <!-- 1. OFFICIAL REAL ZAVORTH MASCOT (Exact Vector Spec) -->
    <g transform="translate(0, 5)">
      <!-- Radial Aura behind mascot -->
      <circle cx="105" cy="105" r="130" fill="url(#mascotAura)" />
      
      <!-- Scaled Official Mascot (512x512 scaled to ~210x210) -->
      <g transform="scale(0.41)" shape-rendering="crispEdges">
        <!-- Glow backing -->
        <g filter="url(#neonGlow)" opacity="0.7">
          <rect x="128" y="64" width="64" height="128" fill="#00E88F"/>
          <rect x="320" y="64" width="64" height="128" fill="#00E88F"/>
          <rect x="192" y="192" width="128" height="64" fill="#00E88F"/>
          <rect x="64" y="192" width="384" height="128" fill="#00E88F"/>
          <rect x="0" y="256" width="64" height="64" fill="#00E88F"/>
          <rect x="448" y="256" width="64" height="64" fill="#00E88F"/>
          <rect x="64" y="320" width="384" height="96" fill="#00E88F"/>
          <rect x="128" y="416" width="96" height="64" fill="#00E88F"/>
          <rect x="288" y="416" width="96" height="64" fill="#00E88F"/>
        </g>

        <!-- Sharp Foreground Crisp Mascot -->
        <rect x="128" y="64" width="64" height="128" fill="url(#mascotDark)"/>
        <rect x="320" y="64" width="64" height="128" fill="url(#mascotDark)"/>
        <rect x="192" y="192" width="128" height="64" fill="url(#mascotBody)"/>
        <rect x="64" y="192" width="384" height="128" fill="url(#mascotBody)"/>
        <rect x="0" y="256" width="64" height="64" fill="url(#mascotDark)"/>
        <rect x="448" y="256" width="64" height="64" fill="url(#mascotDark)"/>
        <rect x="64" y="320" width="384" height="96" fill="url(#mascotBody)"/>
        <rect x="128" y="416" width="96" height="64" fill="url(#mascotDark)"/>
        <rect x="288" y="416" width="96" height="64" fill="url(#mascotDark)"/>
        <!-- Eyes -->
        <rect x="160" y="240" width="32" height="64" fill="#0b0f0e"/>
        <rect x="320" y="240" width="32" height="64" fill="#0b0f0e"/>
      </g>
    </g>

    <!-- 2. TYPOGRAPHY (Bold, High-Impact & Evident) -->
    <g transform="translate(260, 30)">
      <!-- Massive Wordmark in Evidence with Neon Gradient -->
      <text x="0" y="70" font-family="system-ui, -apple-system, 'SF Pro Display', 'Inter', 'Montserrat', sans-serif" font-size="88" font-weight="900" fill="url(#brandEmerald)" letter-spacing="-2" filter="url(#textGlow)">
        ZAVORTH
      </text>

      <!-- Primary Tagline -->
      <text x="4" y="122" font-family="system-ui, -apple-system, 'SF Pro Text', 'Inter', sans-serif" font-size="24" font-weight="700" fill="#ffffff" letter-spacing="-0.3">
        Your AI that does things — and proves it.
      </text>

      <!-- Subtitle -->
      <text x="4" y="156" font-family="system-ui, -apple-system, 'SF Pro Text', 'Inter', sans-serif" font-size="16" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
        Ask naturally. Approve real risk. Keep cryptographic receipts.
      </text>
    </g>

  </g>
</svg>
