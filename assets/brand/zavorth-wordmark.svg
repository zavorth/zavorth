<svg xmlns="http://www.w3.org/2000/svg" width="720" height="160" viewBox="0 0 720 160" fill="none" role="img" aria-label="Zavorth">
  <defs>
    <linearGradient id="g" x1="40" y1="20" x2="680" y2="140" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00E88F"/>
      <stop offset="1" stop-color="#3FE7A8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- pixel mascot mark -->
  <g transform="translate(36,28) scale(0.18)" shape-rendering="crispEdges">
    <rect x="128" y="64" width="64" height="128" fill="#2A5E2F"/>
    <rect x="320" y="64" width="64" height="128" fill="#2A5E2F"/>
    <rect x="192" y="192" width="128" height="64" fill="#3F7A42"/>
    <rect x="64" y="192" width="384" height="128" fill="#3F7A42"/>
    <rect x="0" y="256" width="64" height="64" fill="#2A5E2F"/>
    <rect x="448" y="256" width="64" height="64" fill="#2A5E2F"/>
    <rect x="64" y="320" width="384" height="96" fill="#3F7A42"/>
    <rect x="128" y="416" width="96" height="64" fill="#2A5E2F"/>
    <rect x="288" y="416" width="96" height="64" fill="#2A5E2F"/>
    <rect x="160" y="240" width="32" height="64" fill="#000"/>
    <rect x="320" y="240" width="32" height="64" fill="#000"/>
  </g>
  <text x="160" y="98" fill="url(#g)" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Inter, Arial" font-size="72" font-weight="700" letter-spacing="-2" filter="url(#glow)">ZAVORTH</text>
  <text x="164" y="128" fill="#8AA89A" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Inter, Arial" font-size="16" letter-spacing="4">GOVERNED AGENT RUNTIME</text>
</svg>
