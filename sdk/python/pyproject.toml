[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zavorth-client"
version = "1.0.0"
description = "Official Python SDK for Zavorth REST API v1"
readme = "README.md"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
include = ["zavorth*"]
