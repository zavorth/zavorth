name: Lint

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    name: Static Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run TypeScript check
        run: node --max-old-space-size=4096 node_modules/typescript/bin/tsc --noEmit --pretty false

  surface-syntax:
    name: Surface Syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check surface syntax
        run: npm run surfaces:check --silent

  mcp-manifest:
    name: MCP Manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate MCP manifest
        run: node -e "JSON.parse(require('fs').readFileSync('config/mcp-servers.json','utf8')); console.log('MCP manifest valid')"

      - name: Validate platform registry
        run: node -e "JSON.parse(require('fs').readFileSync('config/platform-registry.json','utf8')); console.log('Platform registry valid')"

      - name: Validate marketplace index
        run: node -e "JSON.parse(require('fs').readFileSync('config/marketplace-index.json','utf8')); console.log('Marketplace index valid')"
