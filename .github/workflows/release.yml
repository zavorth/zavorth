name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip publish)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write
  packages: write
  id-token: write

env:
  NODE_VERSION: '22'
  # dry_run true when workflow_dispatch default; false on tag push
  RELEASE_DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'false') && 'true' || 'false' }}

jobs:
  pre-release:
    name: Pre-release Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript type-check
        run: node --max-old-space-size=4096 node_modules/typescript/bin/tsc --noEmit --pretty false

      - name: Build
        run: npm run build --silent

      - name: Verify package.json
        run: node -e "
          const pkg = require('./package.json');
          console.log('Name:', pkg.name);
          console.log('Version:', pkg.version);
          console.log('License:', pkg.license);
          if (!pkg.version) process.exit(1);
          if (pkg.license !== 'MIT') process.exit(1);
        "

      - name: Run release check
        run: npm run release:check --silent

  test-suite:
    name: Full Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: pre-release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Security tests
        run: npm run test:ci:security --silent

      - name: Core tests
        run: npm run test:ci:services --silent -- --timeout-ms=900000
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Runtime tests
        run: npm run test:ci:runtime-agent --silent

      - name: Channels tests
        run: npm run test:ci:channels --silent

      - name: Telegram tests
        run: npm run test:ci:telegram --silent

      - name: Channel completeness contract
        run: npx jest tests/gateways/ChannelCompletenessService.test.ts tests/gateways/WebhookGateway.completeness.test.ts --runInBand --forceExit --coverage=false

  docker:
    name: Docker Build & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: pre-release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: tags
        env:
          # Without Docker Hub login, only push GHCR tags (Hub tags still computed when secrets present).
          DOCKER_TAGS_GHCR_ONLY: ${{ secrets.DOCKERHUB_TOKEN == '' && 'true' || 'false' }}
        run: node scripts/docker-release-tags.mjs "${{ github.ref_name || 'dev' }}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: env.RELEASE_DRY_RUN != 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: ${{ env.RELEASE_DRY_RUN != 'true' && startsWith(github.ref, 'refs/tags/v') && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Build Docker image (dry-run / always)
        if: env.RELEASE_DRY_RUN == 'true' || !startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: zavorth:${{ github.ref_name || 'dev' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Docker image
        if: env.RELEASE_DRY_RUN != 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Smoke-run container health (local image)
        if: env.RELEASE_DRY_RUN == 'true' || !startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          docker build -t zavorth:smoke .
          # Start briefly; healthcheck may fail without full runtime — only prove image starts
          cid=$(docker run -d -p 33333:33333 zavorth:smoke || true)
          sleep 3
          if [ -n "${cid:-}" ]; then
            docker logs "$cid" 2>&1 | tail -n 40 || true
            docker stop "$cid" || true
            docker rm "$cid" || true
          fi
          echo "Docker local smoke finished"

  windows-smoke:
    name: Windows Smoke
    runs-on: windows-latest
    timeout-minutes: 20
    needs: pre-release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build (if needed for CLI entry)
        run: npm run build --silent
        continue-on-error: true

      - name: Windows smoke script
        run: node scripts/windows-smoke.mjs

  build-binaries:
    name: Build ${{ matrix.platform }}
    needs: pre-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin-arm64
            arch: arm64
          - os: macos-13
            platform: darwin-x64
            arch: x64
          - os: ubuntu-latest
            platform: linux-x64
            arch: x64
          - os: ubuntu-latest
            platform: linux-arm64
            arch: arm64
          - os: windows-latest
            platform: windows-x64
            arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build TypeScript
        run: npm run build --silent

      - name: Compile standalone binary
        run: node scripts/zavorth-compile.mjs

      - name: Package binary
        shell: bash
        run: |
          cd dist-standalone
          VERSION="${GITHUB_REF_NAME:-dev}"
          ARCHIVE="zavorth-${{ matrix.platform }}.tar.gz"

          # Include native addon if it exists
          if [ -d native ]; then
            tar -czf "../${ARCHIVE}" zavorth* native/ 2>/dev/null || tar -czf "../${ARCHIVE}" .
          else
            tar -czf "../${ARCHIVE}" zavorth* 2>/dev/null || tar -czf "../${ARCHIVE}" .
          fi

          echo "Archive: ${ARCHIVE}"
          echo "Size: $(du -h "../${ARCHIVE}" | cut -f1)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform }}
          path: zavorth-${{ matrix.platform }}.tar.gz
          retention-days: 5

  create-release:
    name: Create GitHub Release
    needs: [test-suite, docker, windows-smoke, build-binaries, build-code-tui]
    if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: binary-*
          merge-multiple: true

      - name: Download Code TUI binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: code-tui-*
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Generate checksums
        id: checksums
        run: |
          cd artifacts
          echo "## Checksums" > checksums.txt
          echo '```' >> checksums.txt
          for f in *.tar.gz; do
            sha256sum "$f" | tee -a checksums.txt
          done
          echo '```' >> checksums.txt

          # Export individual checksums for formula update
          for f in *.tar.gz; do
            PLATFORM=$(echo "$f" | sed 's/zavorth-//' | sed 's/.tar.gz//')
            CHECKSUM=$(sha256sum "$f" | cut -d' ' -f1)
            echo "SHA256_${PLATFORM//-/_}=${CHECKSUM}" >> "$GITHUB_OUTPUT"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*.tar.gz
          body: |
            ## Zavorth ${{ github.ref_name }}

            ### Installation

            **Homebrew (macOS/Linux):**
            ```bash
            brew tap zavorth/zavorth https://github.com/zavorth/zavorth.git
            brew install zavorth
            ```

            **Binary downloads:** See assets below.

            **npm:**
            ```bash
            npm install -g zavorth
            ```
            npm packages include platform Code TUI binaries under `packages/code/cli/dist/` so `zavorth` can open the coding shell without installing Bun.

            **Docker (GHCR):**
            ```bash
            docker pull ghcr.io/${{ github.repository_owner }}/zavorth:${{ github.ref_name }}
            ```

            **Code TUI assets:** `code-tui-*.tar.gz` (prebuilt coding shell per OS).

            ${{ steps.checksums.outputs.changelog }}

  build-code-tui:
    name: Code TUI ${{ matrix.platform }}
    needs: pre-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-latest
            platform: darwin-arm64
          - os: macos-13
            platform: darwin-x64
          - os: windows-latest
            platform: windows-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Code workspace
        working-directory: packages/code
        run: bun install --ignore-scripts

      - name: Build Code TUI binary (this platform)
        working-directory: packages/code/cli
        run: bun run script/build.ts --single --skip-install
        # produces dist/zavorth-<os>-<arch>/bin/zavorth

      - name: Package Code TUI binary
        shell: bash
        run: |
          set -euo pipefail
          DIST="packages/code/cli/dist"
          # Find the platform folder created by the build
          FOLDER=$(find "$DIST" -maxdepth 1 -type d -name 'zavorth-*' | head -n 1)
          if [ -z "$FOLDER" ]; then
            echo "No zavorth-* dist folder under $DIST"
            ls -la "$DIST" || true
            exit 1
          fi
          NAME=$(basename "$FOLDER")
          ARCHIVE="code-tui-${{ matrix.platform }}.tar.gz"
          tar -czf "$ARCHIVE" -C "$DIST" "$NAME"
          echo "Packed $ARCHIVE from $NAME"
          ls -lh "$ARCHIVE"

      - name: Upload Code TUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-tui-${{ matrix.platform }}
          path: code-tui-${{ matrix.platform }}.tar.gz
          retention-days: 5

  publish-npm:
    name: Publish to npm
    needs: [test-suite, docker, windows-smoke, build-code-tui]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build --silent

      - name: Download Code TUI binaries
        uses: actions/download-artifact@v4
        with:
          path: .code-tui-artifacts
          pattern: code-tui-*
          merge-multiple: true

      - name: Assemble Code TUI into package tree
        env:
          CODE_BINARY_ARTIFACTS_DIR: ${{ github.workspace }}/.code-tui-artifacts
        run: node scripts/assemble-code-binaries.mjs

      - name: Verify Code binaries present
        run: |
          find packages/code/cli/dist -type f \( -name zavorth -o -name zavorth.exe \) | tee /tmp/code-bins.txt
          test -s /tmp/code-bins.txt

      - name: npm publish preflight
        run: node scripts/npm-publish-preflight.mjs
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Publish to npm (skipped on dry-run)
        if: github.event.inputs.dry_run != 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry-run notice
        if: github.event.inputs.dry_run == 'true'
        run: echo "Dry-run: npm publish skipped after successful preflight/pack dry-run."
