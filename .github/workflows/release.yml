name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip publish)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

env:
  NODE_VERSION: '22'

jobs:
  pre-release:
    name: Pre-release Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript type-check
        run: node --max-old-space-size=4096 node_modules/typescript/bin/tsc --noEmit --pretty false

      - name: Build
        run: npm run build --silent

      - name: Verify package.json
        run: node -e "
          const pkg = require('./package.json');
          console.log('Name:', pkg.name);
          console.log('Version:', pkg.version);
          console.log('License:', pkg.license);
          if (!pkg.version) process.exit(1);
          if (pkg.license !== 'MIT') process.exit(1);
        "

      - name: Run release check
        run: npm run release:check --silent

  test-suite:
    name: Full Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: pre-release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Security tests
        run: npm run test:ci:security --silent

      - name: Core tests
        run: npm run test:ci:services --silent

      - name: Runtime tests
        run: npm run test:ci:runtime-agent --silent

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: pre-release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: zavorth:${{ github.ref_name || 'dev' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-binaries:
    name: Build ${{ matrix.platform }}
    needs: pre-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin-arm64
            arch: arm64
          - os: macos-13
            platform: darwin-x64
            arch: x64
          - os: ubuntu-latest
            platform: linux-x64
            arch: x64
          - os: ubuntu-latest
            platform: linux-arm64
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build TypeScript
        run: npm run build --silent

      - name: Compile standalone binary
        run: node scripts/zavorth-compile.mjs

      - name: Package binary
        shell: bash
        run: |
          cd dist-standalone
          VERSION="${GITHUB_REF_NAME:-dev}"
          ARCHIVE="zavorth-${{ matrix.platform }}.tar.gz"

          # Include native addon if it exists
          if [ -d native ]; then
            tar -czf "../${ARCHIVE}" zavorth* native/
          else
            tar -czf "../${ARCHIVE}" zavorth*
          fi

          echo "Archive: ${ARCHIVE}"
          echo "Size: $(du -h "../${ARCHIVE}" | cut -f1)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform }}
          path: zavorth-${{ matrix.platform }}.tar.gz
          retention-days: 1

  create-release:
    name: Create GitHub Release
    needs: [test-suite, docker, build-binaries]
    if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: binary-*
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Generate checksums
        id: checksums
        run: |
          cd artifacts
          echo "## Checksums" > checksums.txt
          echo '```' >> checksums.txt
          for f in *.tar.gz; do
            sha256sum "$f" | tee -a checksums.txt
          done
          echo '```' >> checksums.txt

          # Export individual checksums for formula update
          for f in *.tar.gz; do
            PLATFORM=$(echo "$f" | sed 's/zavorth-//' | sed 's/.tar.gz//')
            CHECKSUM=$(sha256sum "$f" | cut -d' ' -f1)
            echo "SHA256_${PLATFORM//-/_}=${CHECKSUM}" >> "$GITHUB_OUTPUT"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*.tar.gz
          body: |
            ## Zavorth ${{ github.ref_name }}

            ### Installation

            **Homebrew (macOS/Linux):**
            ```bash
            brew tap zavorth/zavorth https://github.com/zavorth/zavorth.git
            brew install zavorth
            ```

            **Binary downloads:** See assets below.

            **npm:**
            ```bash
            npm install -g zavorth
            ```

            ${{ steps.checksums.outputs.changelog }}

  publish-npm:
    name: Publish to npm
    needs: [test-suite, docker]
    if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build --silent

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
