name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: TypeScript type-check
        run: node --max-old-space-size=4096 node_modules/typescript/bin/tsc --noEmit --pretty false

      - name: Build runtime
        run: npm run runtime:build --silent

      - name: Verify build output
        run: |
          test -d dist || (echo "dist/ directory not found after build" && exit 1)
          test -f dist/index.js || (echo "dist/index.js not found after build" && exit 1)

  test-core:
    name: Core Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Rebuild native modules
        run: |
          npm rebuild better-sqlite3 better-sqlite3-multiple-ciphers --silent \
            || npm rebuild better-sqlite3 better-sqlite3-multiple-ciphers

      - name: Security tests
        run: npm run test:ci:security --silent

      - name: Services tests
        # Large services suite needs a longer group budget once soft-skips shrink the fail surface.
        run: npm run test:ci:services --silent -- --timeout-ms=900000
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Runtime agent tests
        run: npm run test:ci:runtime-agent --silent

      - name: Runtime sessions tests
        run: npm run test:ci:runtime-sessions --silent

      - name: Runtime other tests
        run: npm run test:ci:runtime-other --silent

      - name: Channels tests
        run: npm run test:ci:channels --silent

      - name: Telegram tests
        run: npm run test:ci:telegram --silent

      - name: Channel completeness (all factory channels first-class)
        run: npx jest tests/gateways/ChannelCompletenessService.test.ts tests/gateways/WebhookGateway.completeness.test.ts tests/gateways/ReachChannelSpineService.test.ts --runInBand --forceExit --coverage=false

  monorepo-suite:
    name: Monorepo Suite (grouped)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Rebuild native modules
        run: |
          npm rebuild better-sqlite3 better-sqlite3-multiple-ciphers --silent \
            || npm rebuild better-sqlite3 better-sqlite3-multiple-ciphers

      - name: Full grouped monorepo suite
        run: npm run test:ci --silent -- --timeout-ms=600000
        env:
          NODE_OPTIONS: --max-old-space-size=8192

  test-surfaces:
    name: Surface Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Rebuild native modules
        run: |
          npm rebuild better-sqlite3 better-sqlite3-multiple-ciphers --silent \
            || npm rebuild better-sqlite3 better-sqlite3-multiple-ciphers

      - name: Install desktop test dependencies
        run: |
          if [ -f apps/zavorth-desktop/package.json ]; then
            npm install --prefix apps/zavorth-desktop --ignore-scripts --no-audit --no-fund --silent || true
          fi

      - name: API tests
        run: npm run test:ci:api --silent

      - name: AI Gateway tests
        run: npm run test:ci:ai-gateway --silent

      - name: Telegram tests
        run: npm run test:ci:telegram --silent

      - name: Channels tests
        run: npm run test:ci:channels --silent

      - name: Domain zavorthControl tests
        run: npm run test:ci:domain-zavorthControl --silent

      - name: Domain web tests
        run: npm run test:ci:domain-web --silent

      - name: Domain shared tests
        run: npm run test:ci:domain-shared --silent

  test-platform:
    name: Platform Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Rebuild native modules
        run: |
          npm rebuild better-sqlite3 better-sqlite3-multiple-ciphers --silent \
            || npm rebuild better-sqlite3 better-sqlite3-multiple-ciphers

      - name: Platform tests
        run: npm run test:ci:platform --silent

      - name: Integration tests
        run: npm run test:ci:integration --silent

  release-check:
    name: Release Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test-core, test-surfaces, test-platform]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Surface syntax check
        run: npm run surfaces:check --silent
