name: Publish Python SDK

on:
  push:
    branches:
      - main
    tags:
      - 'py-v*'
    paths:
      - 'sdk/python/**'
      - '.github/workflows/publish-python-sdk.yml'
  pull_request:
    paths:
      - 'sdk/python/**'
      - '.github/workflows/publish-python-sdk.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_SDK_DIR: sdk/python

jobs:
  lint-build-test:
    name: Lint, Build & Test (Python SDK)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SDK
        working-directory: ${{ env.PYTHON_SDK_DIR }}
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        working-directory: ${{ env.PYTHON_SDK_DIR }}
        run: ruff check zavorth/ tests/

      - name: Build wheel
        working-directory: ${{ env.PYTHON_SDK_DIR }}
        run: pip install build && python -m build --wheel

      - name: Test
        working-directory: ${{ env.PYTHON_SDK_DIR }}
        run: python -m pytest -v tests/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-build-test
    if: startsWith(github.ref, 'refs/tags/py-v')
    environment:
      name: pypi
      url: https://pypi.org/project/zavorth-client/

    permissions:
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build distributions
        working-directory: ${{ env.PYTHON_SDK_DIR }}
        run: pip install build && python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
