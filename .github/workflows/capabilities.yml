name: Capabilities

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verified-capabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: node --max-old-space-size=4096 node_modules/typescript/bin/tsc --noEmit --pretty false
      - run: npm run qa:zavorth-natural-action-harness --silent
      - run: npm run qa:zavorth-capability-usage-docs --silent
      - run: npm run security:ci --silent