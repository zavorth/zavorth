name: Security

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Security gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Rebuild native modules
        run: |
          npm rebuild better-sqlite3 better-sqlite3-multiple-ciphers --silent \
            || npm rebuild better-sqlite3 better-sqlite3-multiple-ciphers

      - name: Run security CI
        run: npm run security:ci
